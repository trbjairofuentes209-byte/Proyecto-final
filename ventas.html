<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | SmartInventory</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <h2>SmartInventory</h2>
        <nav>
            <a href="dashboard.html">🏠 Inicio</a>
            <a href="productos.html">📦 Productos</a>
            <a href="categorias.html">📋 Categorías</a>
            <a href="ventas.html" id="Ventas">📋 Ventas</a>
            <a href="mi-perfil.html" id="MiPerfil">
            👤 Mi Perfil
        </a>
            <a href="login.html" id="cerrarSesion">🚪 Cerrar sesión</a>
        </nav>
    </aside>

    <main class="contenido">
        <h2>Registrar Nueva Venta</h2>
        
        <section>
            <label for="selectProducto">Buscar Producto:</label>
            <select id="selectProducto">
                <option value="">-- Selecciona un producto --</option>
            </select>

            <label for="cantidadVenta">Cantidad a vender:</label>
            <input type="number" id="cantidadVenta" min="1" value="1">

            <button id="btnRegistrarVenta">Registrar Venta</button>
        </section>

        <hr>

        <h2>Historial de Ventas</h2>
        <div class="resumen-ventas">
    <h3>Total Vendido: <span id="totalVentasAcumulado">$0.00</span></h3>
</div>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Cantidad Vendida</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tablaVentas">
                </tbody>
        </table>
    </main>
</div>

<script type="module" src="js/ventas.js"></script>
</body>
</html>
