<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | SmartInventory</title>
    <link rel="stylesheet" href="CSS/ventas.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="theme-color" content="#1e63c5">
</head>
<body>
<div class="dashboard">
    
    <button id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú">☰</button>
    
    <div id="overlay-menu" class="overlay-menu"></div>

    <aside class="sidebar" id="sidebar">
      <button id="btn-cerrar-menu" class="btn-cerrar-menu" aria-label="Cerrar menú">&times;</button>
      <h2>SmartInventory</h2>
      <nav>
        <a href="dashboard.html">🏠 Inicio</a>
        <a href="productos.html">📦 Productos</a>
        <a href="categorias.html">📋 Categorías</a>
        <a href="ventas.html">📋 Ventas</a>
        <a href="perfil.html">👤 Mi Perfil</a>
        <a href="login.html">🚪 Cerrar sesión</a>
      </nav>
    </aside>

    <main class="contenido">
        <h2>Registrar Nueva Venta</h2>
        
       <section>
    <label for="selectCategoriaFiltro">Filtrar por Categoría:</label>
    <select id="selectCategoriaFiltro">
        <option value="">-- Todas las categorías --</option>
    </select>

    <label for="selectProducto">Buscar Producto:</label>
    <select id="selectProducto">
        <option value="">-- Selecciona un producto --</option>
    </select>

    <label for="cantidadVenta">Cantidad a vender:</label>
    <input type="number" id="cantidadVenta" min="1" value="1">

    <button id="btnRegistrarVenta">Registrar Venta</button>
</section>

        <hr>

        <h2>Historial de Ventas</h2>
        <div class="resumen-ventas">
    <h3>Total Vendido: <span id="totalVentasAcumulado">$0.00</span></h3>
</div>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Cantidad Vendida</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tablaVentas">
                </tbody>
        </table>
    </main>
</div>

<script src="js/menu.js"></script>
<script type="module" src="js/ventas.js"></script>
<script src="js/pwa.js"></script>
