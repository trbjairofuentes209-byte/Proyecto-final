<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SmartInventory</title>

  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <meta name="theme-color" content="#1e63c5">
</head>

<body>
  <div class="dashboard">
    
    <button id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú">☰</button>
    
    <div id="overlay-menu" class="overlay-menu"></div>

    <aside class="sidebar" id="sidebar">
      <button id="btn-cerrar-menu" class="btn-cerrar-menu" aria-label="Cerrar menú">&times;</button>
      <h2>SmartInventory</h2>
      <nav>
        <a href="dashboard.html">🏠 Inicio</a>
        <a href="productos.html">📦 Productos</a>
        <a href="categorias.html">📋 Categorías</a>
        <a href="ventas.html">📋 Ventas</a>
        <a href="perfil.html">👤 Mi Perfil</a>
        <a href="login.html" id="cerrarSesion">🚪 Cerrar sesión</a>
      </nav>
    </aside>

    <main class="contenido">

      <header class="header-dashboard">
        <h1>Panel Principal</h1>

        <a href="perfil.html" class="user-bubble" title="Ir a Mi Perfil">
          <img id="userFoto" src="https://ui-avatars.com/api/?name=Usuario&background=1e63c5&color=fff&rounded=true" alt="Foto de perfil" class="user-avatar-bubble">
        </a>
      </header>

      <p id="usuarioActivo"></p>

      <div class="cards">
        <div class="card">
          <h2 id="totalProductos">0</h2>
          <p>Productos</p>
        </div>

        <div class="card">
          <h2 id="totalCategorias">0</h2>
          <p>Categorías</p>
        </div>

        <div class="card">
          <h2 id="stockTotal">0</h2>
          <p>Existencias</p>
        </div>

        <div class="card">
          <h2 id="stockBajo">0</h2>
          <p>Stock Bajo</p>
        </div>

        <div class="card">
          <h2 id="valorInventario">$0.00</h2>
          <p>Valor del Inventario</p>
        </div>
      </div>

      <section class="panel">
        <h2>⚠ Productos con poco stock</h2>
        <ul id="listaStockBajo"></ul>
      </section>

    </main>

  </div>

  <script src="js/menu.js"></script>
  <script type="module" src="js/dashboard.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
