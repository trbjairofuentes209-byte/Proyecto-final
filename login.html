<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión</title>

</head>

<body>

    <form id="formLogin">

        <input
            type="email"
            id="correo"
            placeholder="Correo electrónico"
            required>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required>

        <button type="submit">
            Iniciar Sesión
        </button>

        <p id="mensajeLogin"></p>

    </form>

    <script type="module" src="js/login.js"></script>

</body>

</html>
