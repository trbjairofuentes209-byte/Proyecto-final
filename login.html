<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiblook Admin - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/STYTLE.CSS">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-logo-container">
            <div class="brand-box-icon">
                <i class="fa-solid fa-cube"></i>
            </div>
            <h2>Hiblook Admin</h2>
            <p class="login-subtitle">Ingresa tu contraseña para continuar</p>
        </div>

        <form id="login-form" class="login-form">
            <div class="input-group">
                <label for="admin-password">
                    <i class="fa-solid fa-lock"></i> Contraseña
                </label>
                <div class="password-wrapper">
                    <input type="password" id="admin-password" placeholder="••••••••••••" required>
                </form>
            </div>

            <div id="error-message" class="login-error-msg" style="display: none;">
                <i class="fa-solid fa-circle-exclamation"></i> Contraseña incorrecta. Inténtalo de nuevo.
            </div>

            <button type="submit" class="login-submit-btn" form="login-form">
                Ingresar <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="login-footer-links">
            <a href="INDEX.html" class="back-store-link">Volver a la tienda</a>
        </div>
    </div>

    <script src="JS/login.js"></script>
</body>
</html>
