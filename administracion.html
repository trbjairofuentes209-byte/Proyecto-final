<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiblook Admin - Inventario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/STYTLE.CSS">
</head>
<body class="admin-body">

    <header class="admin-header">
        <div class="admin-brand">
            <div class="admin-logo-box">
                <i class="fa-solid fa-cube"></i>
            </div>
            <span>Hiblook Admin</span>
        </div>
        <div class="admin-nav-actions">
            <a href="INDEX.html" class="nav-action-btn"><i class="fa-solid fa-store"></i> Ver tienda</a>
            <a href="login.html" class="nav-action-btn logout"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
        </div>
    </header>

    <main class="admin-container">
        <div class="admin-title-section">
            <div>
                <h1>Inventario</h1>
                <p class="subtitle">Gestiona los productos de tu tienda</p>
            </div>
            <button id="open-create-modal" class="btn-primary">
                <i class="fa-solid fa-plus"></i> Nuevo Producto
            </button>
        </div>

        <div class="admin-toolbar">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="admin-search" placeholder="Buscar productos...">
            </div>
        </div>

        <div class="table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>PRODUCTO</th>
                        <th>CATEGORÍA</th>
                        <th>PRECIO</th>
                        <th>STOCK</th>
                        <th>ESTADO</th>
                        <th class="text-center">ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="inventory-table-body">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="product-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Producto</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            <form id="product-form" class="modal-form">
                <input type="hidden" id="product-id">

                <div class="form-group">
                    <label for="prod-name">Nombre del Producto</label>
                    <input type="text" id="prod-name" required placeholder="Ej. Peluche Totoro Grande">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-category">Categoría</label>
                        <select id="prod-category" required>
                            <option value="Pelunches">Peluches</option>
                            <option value="Pulseras">Pulseras</option>
                            <option value="Figuras">Figuras</option>
                            <option value="Llaveros">Llaveros</option>
                            <option value="Ropa">Ropa</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prod-status">Estado</label>
                        <select id="prod-status">
                            <option value="Destacado">Destacado</option>
                            <option value="Estándar">Estándar</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prod-price">Precio ($)</label>
                        <input type="number" id="prod-price" step="0.01" min="0" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="prod-stock">Stock disponible</label>
                        <input type="number" id="prod-stock" min="0" required placeholder="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="prod-img">Enlace / URL de la Imagen</label>
                    <input type="text" id="prod-img" placeholder="IMG/nombre-imagen.jpg o URL de internet" required>
                </div>

                <div class="modal-actions">
                    <button type="button" id="cancel-modal-btn" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <script src="JS/admin.js"></script>
</body>
</html>
