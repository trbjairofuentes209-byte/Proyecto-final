<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña</title>
</head>

<body>

    <form id="formNuevaPassword">

        <h2>Nueva contraseña</h2>

        <input
            type="password"
            id="password"
            placeholder="Nueva contraseña"
            required>

        <input
            type="password"
            id="confirmarPassword"
            placeholder="Confirmar contraseña"
            required>

        <button type="submit">

            Guardar contraseña

        </button>

        <p id="mensajePassword"></p>

    </form>

    <script type="module" src="js/nueva-password.js"></script>

</body>

</html>
