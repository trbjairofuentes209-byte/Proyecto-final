<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Productos</title>

<link rel="stylesheet" href="css/productos.css">

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<h2>SmartInventory</h2>

<a href="dashboard.html">Inicio</a>

<a href="productos.html">Productos</a>

</aside>

<main class="contenido">

<h1>Productos</h1>

<form id="formProducto">

<input
type="text"
id="nombre"
placeholder="Nombre del producto"
required>

<input
type="text"
id="categoria"
placeholder="Categoría"
required>

<input
type="number"
id="cantidad"
placeholder="Cantidad"
required>

<input
type="number"
id="precio"
placeholder="Precio"
required>

<button>

Guardar Producto

</button>

</form>

<table>

<thead>

<tr>

<th>Nombre</th>

<th>Categoría</th>

<th>Cantidad</th>

<th>Precio</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaProductos">

</tbody>

</table>

</main>

</div>

<script type="module" src="js/productos.js"></script>

</body>

</html>
