<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Categorías</title>
  <link rel="stylesheet" href="css/categorias.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="theme-color" content="#1e63c5">
</head>
<body>

   <div class="dashboard">
    
    <button id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú">☰</button>
    
    <div id="overlay-menu" class="overlay-menu"></div>

    <aside class="sidebar" id="sidebar">
      <button id="btn-cerrar-menu" class="btn-cerrar-menu" aria-label="Cerrar menú">&times;</button>
      <h2>SmartInventory</h2>
      <nav>
        <a href="dashboard.html">🏠 Inicio</a>
        <a href="productos.html">📦 Productos</a>
        <a href="categorias.html">📋 Categorías</a>
        <a href="ventas.html">📋 Ventas</a>
        <a href="perfil.html">👤 Mi Perfil</a>
        <a href="login.html">🚪 Cerrar sesión</a>
      </nav>
    </aside>

    <main class="contenido">
      <h2 id="titulo-form">Crear Nueva Categoría</h2>
      
      <form id="form-crear-categoria">
        <input type="hidden" id="categoria-id" value="">
        <div>
          <label for="nombre-categoria">Nombre de la Categoría:</label>
          <input type="text" id="nombre-categoria" name="nombre" required placeholder="Ej. Bebidas, Snacks..." />
        </div>
        <br>
        <button type="submit" id="btn-guardar-cat">Guardar Categoría</button>
        <button type="button" id="btn-cancelar-edicion" style="display: none;">Cancelar Edición</button>
      </form>

      <hr style="margin: 30px 0;">

      <div class="buscador-container" style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
        <label for="buscarCategoria" style="font-size: 1.2rem;">🔍</label>
        <input type="text" id="buscarCategoria" placeholder="Buscar categoría..." style="padding: 8px; width: 100%; max-width: 300px;">
      </div>

      <h3>Categorías Existentes</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaCategorias">
          </tbody>
      </table>
    </main>
  </div>

  <script src="js/menu.js"></script>
  <script type="module" src="js/categorias.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
