<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="css/productos.css">
</head>
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <h2>SmartInventory</h2>
      <nav>

        <a href="dashboard.html">
            🏠 Inicio
        </a>

        <a href="productos.html">
            📦 Productos
        </a>

        <a href="categorias.html">
            📋 Categorías
        </a>
        <a href="ventas.html" id="Ventas">
            📋 Ventas
        </a>
        <a href="mi-perfil.html" id="MiPerfil">
            👤 Mi Perfil
        </a>
        <a href="login.html" id="cerrarSesion">
            🚪 Cerrar sesión
        </a>

    </nav>
    </aside>

    <main class="contenido">

    <h1>Mi Perfil</h1>

    <div class="perfil-card">

        <img
            id="fotoPerfil"
            src="img/perfil-default.png"
            alt="Foto de perfil"
            class="foto-perfil">

        <input
            type="file"
            id="imagenPerfil"
            accept="image/*">

        <form id="formPerfil">

            <label>Nombre</label>

            <input
                type="text"
                id="nombre"
                required>

            <label>Correo electrónico</label>

            <input
                type="email"
                id="correo"
                readonly>

            <label>Empresa</label>

            <input
                type="text"
                id="empresa">

            <button type="submit">

                Guardar cambios

            </button>

        </form>

    </div>

</main>

<script type="module" src="js/perfil.js"></script>

</body>
</html>
