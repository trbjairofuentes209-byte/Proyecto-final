<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="CSS/productos.css">
   <link rel="stylesheet" href="CSS/perfil.css">
   <link rel="manifest" href="manifest.json">
   <link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="theme-color" content="#1e63c5">
</head>
<body>

<div class="dashboard">
    
    <button id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú">☰</button>
    
    <div id="overlay-menu" class="overlay-menu"></div>

    <aside class="sidebar" id="sidebar">
      <button id="btn-cerrar-menu" class="btn-cerrar-menu" aria-label="Cerrar menú">&times;</button>
      <h2>SmartInventory</h2>
      <nav>
        <a href="dashboard.html">🏠 Inicio</a>
        <a href="productos.html">📦 Productos</a>
        <a href="categorias.html">📋 Categorías</a>
        <a href="ventas.html">📋 Ventas</a>
        <a href="perfil.html">👤 Mi Perfil</a>
        <a href="login.html">🚪 Cerrar sesión</a>
      </nav>
    </aside>

    <main class="contenido">
      

    <div class="perfil-card">
          <h1>Mi Perfil</h1>
        <img
    id="fotoPerfil"
    src="https://placehold.co/200x200/png"
    alt="Foto de perfil"
    class="foto-perfil">

            <div class="upload-container">
    <label for="imagenPerfil" class="btn-subir">
        📷 Cambiar foto de perfil
    </label>

    <input
        type="file"
        id="imagenPerfil"
        accept="image/*">

    <span id="nombreArchivo">Ningún archivo seleccionado</span>
</div>
        <form id="formPerfil">

            <label>Nombre</label>

            <input
                type="text"
                id="nombre"
                required>

            <label>Correo electrónico</label>

            <input
                type="email"
                id="correo"
                readonly>

            <label>Empresa</label>

            <input
                type="text"
                id="empresa">

            <button type="submit">  Guardar cambios</button>
            
      <a href="dashboard.html" class="btn-crear">Cancelar</a>
        </form>

    </div>

</main>
 <script src="js/menu.js"></script>
<script type="module" src="js/perfil.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
