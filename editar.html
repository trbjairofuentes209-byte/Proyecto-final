<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Producto - SmartInventory</title>
  <link rel="stylesheet" href="css/productos.css">
  <link rel="stylesheet" href="css/editar.css">
<body>

  <div class="dashboard">
    <aside class="sidebar">
      <h2>SmartInventory</h2>
      <nav>
        <a href="dashboard.html">🏠 Inicio</a>
        <a href="productos.html">📦 Productos</a>
        <a href="categorias.html">📋 Categorías</a>
        <a href="ventas.html" id="Ventas">📋 Ventas</a>
        <a href="perfil.html" id="MiPerfil">👤 Mi Perfil</a>
        <a href="login.html" id="cerrarSesion">🚪 Cerrar sesión</a>
      </nav>
    </aside>

    <main class="contenido">
      <section id="seccion-editar-producto">
        <h2>Editar Producto</h2>
        
        <form id="form-editar-producto">
          <input type="hidden" id="edit-id" name="id" />

          <div class="form-group">
            <label for="edit-nombre">Nombre del Producto:</label>
            <input type="text" id="edit-nombre" name="nombre" required />
          </div>

          <div class="form-group">
            <label for="edit-precio">Precio:</label>
            <input type="number" id="edit-precio" name="precio" step="0.01" min="0" required />
          </div>

          <div class="form-group">
            <label for="edit-stock">Stock disponible:</label>
            <input type="number" id="edit-stock" name="stock" min="0" required />
          </div>

          <div class="form-group">
            <label for="edit-descripcion">Descripción:</label>
            <textarea id="edit-descripcion" name="descripcion" rows="4"></textarea>
          </div>

          <div class="form-acciones">
            <button type="submit" id="btn-actualizar">Actualizar Producto</button>
            <a href="productos.html" class="btn-cancelar">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="js/editar.js"></script>
</body>
</html>
