<body>

  <div class="dashboard">
    
    <button id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú">☰</button>
    
    <div id="overlay-menu" class="overlay-menu"></div>

    <aside class="sidebar" id="sidebar">
      <button id="btn-cerrar-menu" class="btn-cerrar-menu" aria-label="Cerrar menú">&times;</button>
      <h2>SmartInventory</h2>
      <nav>

      <section id="seccion-editar-producto">
        <h2>Editar Producto</h2>
        
        <form id="form-editar-producto">
          <input type="hidden" id="edit-id" name="id" />

          <div class="form-group">
            <label for="edit-nombre">Nombre del Producto:</label>
            <input type="text" id="edit-nombre" name="nombre" required />
          </div>

          <div class="form-group">
            <label for="edit-precio">Precio:</label>
            <input type="number" id="edit-precio" name="precio" step="0.01" min="0" required />
          </div>

          <div class="form-group">
            <label for="edit-stock">Stock disponible:</label>
            <input type="number" id="edit-stock" name="stock" min="0" required />
          </div>

          <div class="form-acciones">
            <button type="submit" id="btn-actualizar">Actualizar Producto</button>
            <a href="productos.html" class="btn-cancelar">Cancelar</a>
          </div>
        </form>
      </section>
    </main>

  </div>
