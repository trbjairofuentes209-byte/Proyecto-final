<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agregar Producto</title>
</head>
<body>
  <section id="seccion-crear-producto">
    <h2>Agregar Nuevo Producto</h2>
    
    <form id="form-crear-producto">
      <div>
        <label for="nombre">Nombre del Producto:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Smartwatch Pro" />
      </div>

      <div>
        <label for="categoria">Categoría:</label>
        <select id="categoria" name="categoria" required>
        </select>
      </div>

      <div>
        <label for="precio">Precio:</label>
        <input type="number" id="precio" name="precio" step="0.01" min="0" required placeholder="0.00" />
      </div>

      <div>
        <label for="cantidad">Stock disponible:</label>
        <input type="number" id="cantidad" name="cantidad" min="0" required placeholder="10" />
      </div>

      <button type="submit" id="btn-guardar">Guardar Producto</button>
      <a href="productos.html" class="btn-crear">Cancelar</a>
    </form>
  </section>

  <script type="module" src="js/crear.js"></script>
</body>
</html>
