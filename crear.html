<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="seccion-crear-producto">
  <h2>Agregar Nuevo Producto</h2>
  <form id="form-crear-producto">
    <div>
      <label for="nombre">Nombre del Producto:</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej. Smartwatch Pro" />
    </div>

    <div>
      <label for="precio">Precio:</label>
      <input type="number" id="precio" name="precio" step="0.01" min="0" required placeholder="0.00" />
    </div>

    <div>
      <label for="stock">Stock disponible:</label>
      <input type="number" id="stock" name="stock" min="0" required placeholder="10" />
    </div>

    <div>
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion" rows="4" placeholder="Descripción detallada del artículo..."></textarea>
    </div>

    <button type="submit" id="btn-guardar">Guardar Producto</button>
   <a href="productos.html" class="btn-crear">cancelar</a>

  </form>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/app.js"></script>
</body>
</html>
